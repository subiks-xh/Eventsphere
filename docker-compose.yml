version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://eventsphere_user:secretpassword@db:5432/eventsphere
      - SECRET_KEY=super-secret-production-key-change-me
      - DISABLE_SCHEDULER=True
    depends_on:
      - db
    restart: always

  scheduler:
    build: .
    # Override command to run the APScheduler only without the web worker
    command: python -c "from app import create_app; app=create_app(); app.run(port=8001)"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://eventsphere_user:secretpassword@db:5432/eventsphere
      - SECRET_KEY=super-secret-production-key-change-me
      - WERKZEUG_RUN_MAIN=true  # Force scheduler start
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=eventsphere_user
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=eventsphere
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  pgdata:
