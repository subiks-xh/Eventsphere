{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Notifications</h2>
    
    {% if notifications %}
        <ul style="list-style-type: none; padding: 0;">
            {% for notification in notifications|reverse %}
                <li style="background-color: #f8f9fa; margin-bottom: 10px; padding: 15px; border-left: 4px solid #0056b3; border-radius: 4px;">
                    {{ notification }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No notifications yet.</p>
    {% endif %}
</div>
{% endblock %}
